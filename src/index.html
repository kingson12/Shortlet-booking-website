<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <link href="./input.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.2/feather.min.js"
      integrity="sha512-zMm7+ZQ8AZr1r3W8Z8lDATkH05QG5Gm2xc6MlsCdBz9l6oE8Y7IXByMgSm/rdRQrhuHt99HAYfMljBOEZ68q5A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <title>Document</title>
  </head>
  <body>
    <nav class="py-6">
      <div class="w-[90%] mx-auto max-w-7xl">
        <div class="flex justify-between items-center">
          <img src="/src/image/logo.png" alt="logo" width="100" />

          <!-- Desktop Menu -->
          <div class="hidden md:flex gap-4 items-center">
            <a href="" class="text-lg font-[700] px-4">Special Offer</a>
            <a href="" class="text-lg font-[700] px-4">Offer</a>
            <div
              class="flex items-center h-12 w-72 px-4 bg-gray-100 rounded-full"
            >
              <input
                type="text"
                class="w-full bg-transparent focus:outline-0"
                placeholder="Search here"
              />
              <i data-feather="search" class="text-[#f87c26]"></i>
            </div>
            <button class="bg-[#f87c26] text-white py-2 px-6 rounded-full">
              login
            </button>
          </div>

          <!-- mobile toggle -->
          <input type="checkbox" id="menu-toggle" class="peer hidden" />
          <label for="menu-toggle" class="block md:hidden cursor-pointer">
            <i data-feather="menu" class="text-2xl"></i>
          </label>

          <!-- Mobile Menu -->
          <div
            class="fixed left-0 top-0 w-full h-full bg-white shadow-2xl flex flex-col gap-6 items-center justify-center transition-all duration-300 ease-in-out peer-checked:translate-x-0 -translate-x-full md:hidden"
          >
            <label
              for="menu-toggle"
              class="absolute top-6 right-6 cursor-pointer"
            >
              <i data-feather="x" class="text-3xl"></i>
            </label>
            <a href="" class="text-lg font-[700] px-4">Special Offer</a>
            <a href="" class="text-lg font-[700] px-4">Offer</a>
            <div
              class="flex items-center h-12 w-72 px-4 bg-gray-100 rounded-full"
            >
              <input
                type="text"
                class="w-full bg-transparent focus:outline-0"
                placeholder="Search here"
              />
              <i data-feather="search" class="text-[#f87c26]"></i>
            </div>
            <button class="bg-[#f87c26] text-white py-2 px-6 rounded-full">
              login
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- hero -->

    <div class="w-[90%] mx-auto max-w-7xl py-12">
      <div
        class="flex flex-col md:flex-row items-start md:justify-between md:items-end gap-8"
      >
        <div>
          <h1 class="font-[700] text-5xl md:text-7xl capitalize">
            Find your ideal apartment with comfort and convenience
          </h1>
          <p class="text-lg text-gray-600 mt-8">
            Explore our Curated selection of premium short-term rentals tailored
            to your needs. Enjoy top-notch Amenities, seamless booking and a
            hassle-free stay in prime locations.
          </p>
        </div>
        <button
          class="bg-gray-900 flex items-center gap-3 text-white py-3 px-6 rounded-full min-w-max"
        >
          <i data-feather="search" class="w-5 h-5"></i>
          Discover shotlet
        </button>
      </div>
    </div>

    <!-- Grid -->
    <div class="w-[90%] mx-auto max-w-7xl py-6 mb-20">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div
          class="bg-gray-100 h-96 rounded-3xl p-6 flex items-end bg-[url(/src/image/img1.png)] bg-cover"
        >
          <div class="flex w-full justify-between items-center">
            <p class="text-white text-xl">Lagos</p>
            <button
              class="bg-[#f87c26] flex items-center gap-3 text-white py-3 px-6 rounded-full cursor-pointer hover:bg-gray-900"
            >
              Explore
              <i data-feather="arrow-up-right" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div
            class="relative group bg-gray-200 overflow-hidden h-96 rounded-3xl bg-[url(/src/image/img2.png)] bg-cover"
          >
            <div
              class="absolute left-0 top-0 w-full h-full group-hover:bg-[rgba(0,0,0,0.2)] flex items-end p-6"
            >
              <div
                class="flex w-full justify-between items-center translate-y-full invisible group-hover:visible group-hover:translate-y-0 transition-all"
              >
                <p class="text-white text-xl">Abuja</p>
                <button
                  class="bg-gray-900 flex items-center gap-3 text-white py-2 px-4 rounded-full cursor-pointer hover:bg-[#f87c26]"
                >
                  <i data-feather="arrow-up-right" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="flex flex-col gap-6">
            <div
              class="relative group bg-gray-200 overflow-hidden h-52 md:h-1/2 rounded-3xl bg-[url(/src/image/img3.png)] bg-cover"
            >
              <div
                class="absolute left-0 top-0 w-full h-full group-hover:bg-[rgba(0,0,0,0.2)] flex items-end p-6"
              >
                <div
                  class="flex w-full justify-between items-center translate-y-full invisible group-hover:visible group-hover:translate-y-0 transition-all"
                >
                  <p class="text-white text-xl">Enugu</p>
                  <button
                    class="bg-gray-900 flex items-center gap-3 text-white py-2 px-4 rounded-full cursor-pointer hover:bg-[#f87c26]"
                  >
                    <i data-feather="arrow-up-right" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>
            </div>
            <div
              class="relative group bg-gray-200 overflow-hidden h-52 md:h-1/2 rounded-3xl bg-[url(/src/image/img4.png)] bg-cover"
            >
              <div
                class="absolute left-0 top-0 w-full h-full group-hover:bg-[rgba(0,0,0,0.2)] flex items-end p-6"
              >
                <div
                  class="flex w-full justify-between items-center translate-y-full invisible group-hover:visible group-hover:translate-y-0 transition-all"
                >
                  <p class="text-white text-xl">Enugu</p>
                  <button
                    class="bg-gray-900 flex items-center gap-3 text-white py-2 px-4 rounded-full cursor-pointer hover:bg-[#f87c26]"
                  >
                    <i data-feather="arrow-up-right" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      feather.replace();
    </script>
  </body>
</html>
